<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Kelvin Ikpeni Marketplace</title>
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <div class="auth-page">
      <aside class="auth-page__aside">
        <h2>Forgot your password?</h2>
        <p>No worries — we'll send you a secure link to reset it.</p>
      </aside>
      <div class="auth-page__form-wrap">
        <div class="auth-form__header">
          <h1 class="auth-form__title">Reset password</h1>
          <p class="auth-form__subtitle">Enter your email and we'll send a reset link</p>
        </div>
        <div class="auth-form__error" id="fp-error"></div>
        <form id="fp-form">
          <div class="form-group">
            <label class="form-label" for="fp-email">Email</label>
            <input type="email" id="fp-email" class="form-input" placeholder="you@example.com" required />
          </div>
          <button type="submit" class="btn btn-primary auth-form__submit" id="fp-btn">Send reset link</button>
        </form>
        <div class="auth-form__footer">
          Remembered it? <a href="/pages/login.html">Sign in</a>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="/js/pages/forgot-password.js"></script>
</body>
</html>
