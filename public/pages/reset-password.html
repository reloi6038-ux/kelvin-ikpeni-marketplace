<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Kelvin Ikpeni Marketplace</title>
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <div class="auth-page">
      <aside class="auth-page__aside">
        <h2>Choose a new password</h2>
        <p>Pick a strong password you haven't used anywhere else.</p>
      </aside>
      <div class="auth-page__form-wrap">
        <div class="auth-form__header">
          <h1 class="auth-form__title">Reset password</h1>
        </div>
        <div class="auth-form__error" id="rp-error"></div>
        <form id="rp-form">
          <div class="form-group">
            <label class="form-label" for="rp-password">New password</label>
            <input type="password" id="rp-password" class="form-input" required minlength="8" />
          </div>
          <div class="form-group">
            <label class="form-label" for="rp-password2">Confirm password</label>
            <input type="password" id="rp-password2" class="form-input" required minlength="8" />
          </div>
          <button type="submit" class="btn btn-primary auth-form__submit" id="rp-btn">Reset password</button>
        </form>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="/js/pages/reset-password.js"></script>
</body>
</html>
