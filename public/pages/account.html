<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account — Kelvin Ikpeni Marketplace</title>
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <div class="breadcrumbs">
      <a href="/">Home</a> <span class="breadcrumbs__separator">›</span>
      <span class="breadcrumbs__current">My Account</span>
    </div>

    <div style="display: grid; grid-template-columns: 260px 1fr; gap: var(--space-6); padding: var(--space-6) 0;">

      <aside class="card" style="padding: var(--space-4); align-self: start; position: sticky; top: 100px;">
        <div style="text-align: center; padding: var(--space-4) 0;">
          <div id="acct-avatar" style="width: 80px; height: 80px; border-radius: 50%; background: var(--color-primary-soft); color: var(--color-primary); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; margin: 0 auto var(--space-3);">
            ?
          </div>
          <h3 id="acct-name" style="margin-bottom: 4px;">Loading…</h3>
          <p id="acct-email" style="color: var(--text-muted); font-size: var(--text-sm); margin: 0;"></p>
        </div>
        <hr style="border: none; border-top: 1px solid var(--border-color); margin: var(--space-3) 0;" />
        <nav style="display: flex; flex-direction: column; gap: 4px;">
          <a href="#profile" class="mobile-menu__link" data-tab="profile">👤 Profile</a>
          <a href="#orders" class="mobile-menu__link" data-tab="orders">📦 Orders</a>
          <a href="/pages/wishlist.html" class="mobile-menu__link">♡ Wishlist</a>
          <a href="#password" class="mobile-menu__link" data-tab="password">🔐 Password</a>
          <button id="acct-logout" class="mobile-menu__link" style="background: none; border: none; text-align: left; cursor: pointer; color: var(--color-danger);">🚪 Sign out</button>
        </nav>
      </aside>

      <section>
        <!-- Profile tab -->
        <div id="tab-profile" class="account-tab">
          <div class="card" style="padding: var(--space-6);">
            <h2 style="margin-bottom: var(--space-4);">Profile Information</h2>
            <div class="auth-form__error" id="profile-error"></div>
            <form id="profile-form">
              <div class="form-group">
                <label class="form-label" for="profile-name">Full name</label>
                <input type="text" id="profile-name" class="form-input" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="profile-email">Email</label>
                <input type="email" id="profile-email" class="form-input" disabled />
                <p class="form-help">Email cannot be changed</p>
              </div>
              <div class="form-group">
                <label class="form-label" for="profile-phone">Phone</label>
                <input type="tel" id="profile-phone" class="form-input" />
              </div>
              <button type="submit" class="btn btn-primary" id="profile-save">Save changes</button>
            </form>
          </div>
        </div>

        <!-- Orders tab -->
        <div id="tab-orders" class="account-tab" hidden>
          <div class="card" style="padding: var(--space-6);">
            <h2 style="margin-bottom: var(--space-4);">My Orders</h2>
            <div id="orders-list">
              <p style="color: var(--text-muted);">Loading orders…</p>
            </div>
          </div>
        </div>

        <!-- Password tab -->
        <div id="tab-password" class="account-tab" hidden>
          <div class="card" style="padding: var(--space-6);">
            <h2 style="margin-bottom: var(--space-4);">Change Password</h2>
            <div class="auth-form__error" id="password-error"></div>
            <form id="password-form">
              <div class="form-group">
                <label class="form-label" for="pw-current">Current password</label>
                <input type="password" id="pw-current" class="form-input" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="pw-new">New password</label>
                <input type="password" id="pw-new" class="form-input" required minlength="8" />
              </div>
              <div class="form-group">
                <label class="form-label" for="pw-new2">Confirm new password</label>
                <input type="password" id="pw-new2" class="form-input" required minlength="8" />
              </div>
              <button type="submit" class="btn btn-primary" id="pw-save">Update password</button>
            </form>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="/js/pages/account.js"></script>
</body>
</html>
