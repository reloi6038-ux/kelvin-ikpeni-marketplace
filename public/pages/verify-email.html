<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email — Kelvin Ikpeni Marketplace</title>
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <div class="auth-page" style="grid-template-columns: 1fr;">
      <div class="auth-page__form-wrap" style="margin: 0 auto;">
        <div class="auth-form__header">
          <h1 class="auth-form__title" id="ve-title">Verifying your email…</h1>
          <p class="auth-form__subtitle" id="ve-message">Please wait</p>
        </div>
        <div style="text-align: center; padding: var(--space-6) 0;">
          <div class="loader loader-lg" id="ve-loader"></div>
        </div>
        <div class="auth-form__footer" id="ve-actions" hidden>
          <a href="/pages/login.html" class="btn btn-primary">Continue to sign in</a>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="/js/pages/verify-email.js"></script>
</body>
</html>
