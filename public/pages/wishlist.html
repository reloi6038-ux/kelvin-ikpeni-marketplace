<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wishlist — Kelvin Ikpeni Marketplace</title>
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <div class="breadcrumbs">
      <a href="/">Home</a> <span class="breadcrumbs__separator">›</span>
      <span class="breadcrumbs__current">Wishlist</span>
    </div>

    <h1 style="margin: var(--space-4) 0;">My Wishlist</h1>

    <div id="wishlist-loading" style="text-align:center; padding: var(--space-16) 0;">
      <div class="loader loader-lg" style="margin: 0 auto;"></div>
    </div>

    <div id="wishlist-empty" class="empty-state" style="display:none;">
      <div class="empty-state__icon">♡</div>
      <h2 class="empty-state__title">Your wishlist is empty</h2>
      <p class="empty-state__message">Save your favourite products to come back to them later.</p>
      <a href="/pages/products.html" class="btn btn-primary">Browse Products</a>
    </div>

    <div class="grid grid-products" id="wishlist-grid" style="display:none;"></div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="/js/pages/wishlist.js"></script>
</body>
</html>
