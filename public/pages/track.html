<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Order — Kelvin Ikpeni Marketplace</title>
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container" style="padding: var(--space-8) 0; min-height: 60vh;">
    <div class="breadcrumbs">
      <a href="/">Home</a> <span class="breadcrumbs__separator">›</span>
      <span class="breadcrumbs__current">Track Order</span>
    </div>

    <div style="max-width: 600px; margin: 0 auto; background: var(--bg-surface); padding: var(--space-8); border-radius: var(--border-radius-lg); border: 1px solid var(--border-color);">
      <h1 style="margin-bottom: var(--space-2); font-size: var(--text-3xl);">Track Your Order</h1>
      <p class="text-secondary" style="margin-bottom: var(--space-6);">Enter your order number to see the current status of your delivery.</p>
      
      <form onsubmit="event.preventDefault(); alert('Order tracking will be available soon.');" style="display: flex; gap: var(--space-2);">
        <input type="text" class="form-input" placeholder="e.g. KIM-123456-7890" required style="flex: 1;">
        <button type="submit" class="btn btn-primary">Track</button>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module">
    import { mountHeader } from '/js/components/header.js';
    import { mountFooter } from '/js/components/footer.js';
    mountHeader();
    mountFooter();
  </script>
</body>
</html>
